<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel DK Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --navy:#0B192C; --navy2:#102338; --blue:#1E3A8A; --cyan:#00B4D8; --bg:#eef2f7; --line:#e2e8f0; --txt:#0f172a; --mut:#64748b; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  .hidden { display:none !important; }
  h1,h2,h3 { font-family:Montserrat,Inter,sans-serif; }

  /* ---------- LOGIN ---------- */
  .login { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px; position:relative; overflow:hidden;
    background:radial-gradient(circle at 15% 10%, rgba(0,180,216,.35), transparent 45%), radial-gradient(circle at 90% 90%, rgba(30,58,138,.7), transparent 50%), #060d18; }
  .login::before { content:''; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size:26px 26px; pointer-events:none; }
  .login .brand { position:relative; }
  .login .brand img { display:block; height:150px; width:auto; max-width:90vw; object-fit:contain; filter:drop-shadow(0 10px 30px rgba(0,180,216,.35)); }
  .login form { position:relative; background:rgba(255,255,255,.08); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.18); padding:36px 32px 30px; border-radius:24px; width:100%; max-width:400px; box-shadow:0 30px 70px rgba(0,0,0,.5); text-align:center; }
  .login h1 { margin:0 0 8px; font-size:24px; font-weight:800; color:#fff; letter-spacing:-.3px; }
  .login p { margin:0 0 26px; color:#b6c8dc; font-size:14px; line-height:1.5; }
  .gbtn { width:100%; display:flex; align-items:center; justify-content:center; gap:12px; background:#fff; color:#1f2937; border:0; padding:14px 18px; border-radius:14px; font-weight:700; font-size:15px; cursor:pointer; transition:transform .15s, box-shadow .15s; box-shadow:0 8px 24px rgba(0,0,0,.25); font-family:inherit; }
  .gbtn:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(0,180,216,.35); }
  .err { font-size:13px; margin-top:12px; min-height:18px; color:#fca5a5; }
  .login .foot { margin-top:18px; font-size:12px; color:#7f93aa; }

  /* ---------- LAYOUT ---------- */
  .app { display:grid; grid-template-columns:270px 1fr; min-height:100vh; }
  aside.side { background:linear-gradient(180deg,var(--navy),#08121f); color:#cbd5e1; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:20px 14px; overflow-y:auto; }
  .side .logo { display:flex; justify-content:center; padding:6px 6px 18px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:14px; }
  .side .logo img { height:62px; width:auto; max-width:100%; object-fit:contain; }
  .side .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:#64809e; margin:12px 10px 8px; font-weight:700; }
  .nav { display:flex; flex-direction:column; gap:4px; }
  .nav button { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:transparent; border:0; color:#b6c8dc; padding:11px 12px; border-radius:12px; cursor:pointer; font:600 14px Inter,sans-serif; transition:background .15s,color .15s; position:relative; }
  .nav button i.ic { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.06); font-size:14px; transition:background .15s; flex:none; }
  .nav button:hover { background:rgba(255,255,255,.06); color:#fff; }
  .nav button.active { background:linear-gradient(90deg,rgba(0,180,216,.28),rgba(0,180,216,.06)); color:#fff; box-shadow:inset 3px 0 0 var(--cyan); }
  .nav button.active i.ic { background:var(--cyan); color:var(--navy); }
  .nav .badge { margin-left:auto; background:#f59e0b; color:#1c1917; font-size:11px; font-weight:800; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 6px; }
  .side .bottom { margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,.08); }
  .user { display:flex; align-items:center; gap:10px; padding:8px 8px 12px; }
  .user img { width:36px; height:36px; border-radius:50%; background:#1e3a5f; object-fit:cover; }
  .user .nm { font-size:13px; font-weight:700; color:#fff; line-height:1.2; }
  .user .em { font-size:11px; color:#7f93aa; word-break:break-all; }
  .side .logout { width:100%; background:rgba(255,255,255,.07); border:0; color:#e2e8f0; padding:10px; border-radius:10px; cursor:pointer; font:600 13px Inter,sans-serif; }
  .side .logout:hover { background:rgba(239,68,68,.25); }

  .content { min-width:0; display:flex; flex-direction:column; }
  .topbar { position:sticky; top:0; z-index:20; background:rgba(238,242,247,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:14px 28px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .topbar .ttl { flex:1; min-width:180px; }
  .topbar h2 { margin:0; font-size:22px; font-weight:900; letter-spacing:-.3px; }
  .topbar .sub { font-size:13px; color:var(--mut); margin-top:2px; }
  .status { font-size:13px; font-weight:600; color:var(--mut); display:flex; align-items:center; gap:6px; }
  .status.dirty { color:#b45309; } .status.ok { color:#15803d; }
  .btn { border:0; padding:11px 18px; border-radius:12px; font:700 14px Inter,sans-serif; cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none; transition:transform .12s, box-shadow .12s, background .12s; }
  .btn:active { transform:scale(.97); }
  .btn-ghost { background:#fff; color:#334155; border:1px solid var(--line); } .btn-ghost:hover { background:#f8fafc; }
  .btn-save { background:linear-gradient(135deg,#16a34a,#22c55e); color:#fff; box-shadow:0 6px 18px rgba(34,197,94,.35); } .btn-save:hover { box-shadow:0 8px 24px rgba(34,197,94,.5); }
  .btn-save:disabled { opacity:.55; cursor:default; box-shadow:none; background:#94a3b8; }
  .btn-sm { padding:7px 11px; font-size:12px; border-radius:9px; }

  main { padding:26px 28px 80px; max-width:1100px; width:100%; }
  .section { display:none; animation:fade .25s ease; }
  .section.active { display:block; }
  @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  /* ---------- VISÃO GERAL ---------- */
  .hero { background:linear-gradient(135deg,var(--navy),var(--blue) 65%,var(--cyan)); color:#fff; border-radius:24px; padding:34px; margin-bottom:24px; position:relative; overflow:hidden; }
  .hero::after { content:''; position:absolute; right:-60px; top:-60px; width:260px; height:260px; border-radius:50%; background:rgba(255,255,255,.1); }
  .hero h3 { margin:0 0 8px; font-size:26px; font-weight:900; }
  .hero p { margin:0; max-width:560px; line-height:1.6; color:#dbeafe; font-size:15px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
  .tile { background:#fff; border:1px solid var(--line); border-radius:20px; padding:20px; cursor:pointer; text-align:left; font-family:inherit; transition:transform .15s, box-shadow .15s, border-color .15s; }
  .tile:hover { transform:translateY(-4px); box-shadow:0 14px 30px rgba(15,23,42,.1); border-color:var(--cyan); }
  .tile .ti { width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,var(--navy),var(--blue)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:14px; }
  .tile b { display:block; font-size:16px; margin-bottom:4px; color:var(--txt); }
  .tile span { font-size:13px; color:var(--mut); }

  /* ---------- CARDS DE CAMPOS ---------- */
  .card { background:#fff; border:1px solid var(--line); border-radius:20px; padding:22px; margin-bottom:18px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
  .card > h4 { margin:0 0 16px; font:800 14px Montserrat,sans-serif; letter-spacing:.04em; text-transform:uppercase; color:var(--blue); display:flex; align-items:center; gap:8px; }
  .card > h4::before { content:''; width:6px; height:18px; border-radius:3px; background:var(--cyan); }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 18px; }
  .grid .full { grid-column:1/-1; }
  .field label { display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700; color:#475569; margin-bottom:7px; }
  .field label .dot { width:8px; height:8px; border-radius:50%; background:#f59e0b; display:none; }
  .field.changed label .dot { display:block; }
  .field .row { display:flex; gap:8px; align-items:flex-start; }
  input[type=text], input[type=url], textarea { width:100%; padding:12px 13px; border:1.5px solid #dbe3ee; border-radius:12px; font:500 14px Inter,sans-serif; color:var(--txt); background:#f8fafc; transition:border-color .15s, background .15s, box-shadow .15s; }
  input:hover, textarea:hover { border-color:#b9c7da; }
  input:focus, textarea:focus { outline:0; border-color:var(--cyan); background:#fff; box-shadow:0 0 0 4px rgba(0,180,216,.15); }
  textarea { min-height:96px; resize:vertical; line-height:1.55; }
  .field.changed input, .field.changed textarea { border-color:#f59e0b; background:#fffbeb; }
  .rst { flex:none; width:42px; height:44px; border-radius:12px; border:1.5px solid #dbe3ee; background:#fff; color:#64748b; cursor:pointer; }
  .rst:hover { background:#fee2e2; color:#dc2626; border-color:#fecaca; }
  .hint { font-size:12px; color:var(--mut); margin-top:6px; }

  /* imagem */
  .imgfield .drop { position:relative; border-radius:16px; overflow:hidden; border:2px dashed #cbd5e1; min-height:170px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:border-color .15s, box-shadow .15s;
    background-color:#e2e8f0; background-image:linear-gradient(45deg,#d5dde8 25%,transparent 25%,transparent 75%,#d5dde8 75%),linear-gradient(45deg,#d5dde8 25%,transparent 25%,transparent 75%,#d5dde8 75%); background-size:20px 20px; background-position:0 0,10px 10px; }
  .imgfield .drop:hover, .imgfield .drop.over { border-color:var(--cyan); box-shadow:0 0 0 4px rgba(0,180,216,.15); }
  .imgfield .drop img { max-width:100%; max-height:260px; object-fit:contain; display:block; }
  .imgfield .drop .ov { position:absolute; inset:0; background:rgba(11,25,44,.65); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-weight:700; font-size:14px; opacity:0; transition:opacity .15s; }
  .imgfield .drop:hover .ov, .imgfield .drop.over .ov { opacity:1; }
  .imgfield .drop .ov i { font-size:26px; }
  .imgfield.changed .drop { border-color:#f59e0b; border-style:solid; }
  .imgfield .acts { display:flex; gap:8px; margin-top:10px; }

  /* preview */
  .preview { position:fixed; top:0; right:0; bottom:0; width:min(460px,92vw); background:#fff; z-index:60; box-shadow:-20px 0 60px rgba(0,0,0,.3); transform:translateX(105%); transition:transform .3s ease; display:flex; flex-direction:column; }
  .preview.open { transform:none; }
  .preview .ph { padding:12px 16px; display:flex; align-items:center; justify-content:space-between; background:var(--navy); color:#fff; font-weight:700; font-size:14px; }
  .preview iframe { flex:1; border:0; width:100%; background:#fff; }
  .preview .ph button { background:rgba(255,255,255,.12); border:0; color:#fff; width:32px; height:32px; border-radius:8px; cursor:pointer; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:13px 22px; border-radius:14px; font-size:14px; font-weight:600; z-index:90; box-shadow:0 14px 40px rgba(0,0,0,.35); display:flex; gap:10px; align-items:center; }

  @media (max-width: 900px) {
    .app { grid-template-columns:1fr; }
    aside.side { position:relative; height:auto; flex-direction:column; padding:12px; }
    .side .logo { padding-bottom:10px; margin-bottom:8px; } .side .logo img { height:48px; }
    .side .lbl, .side .bottom .user { display:none; }
    .nav { flex-direction:row; overflow-x:auto; padding-bottom:6px; }
    .nav button { white-space:nowrap; width:auto; flex:none; padding:9px 12px; }
    .side .bottom { margin-top:6px; padding-top:8px; }
    .topbar { padding:12px 16px; position:relative; }
    main { padding:18px 14px 80px; }
    .grid { grid-template-columns:1fr; }
    .hero { padding:24px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="brand"><img src="logoadmin.png" alt="DK Service" onerror="this.parentElement.style.display='none'"></div>
  <form id="loginForm">
    <h1>Painel de Controle</h1>
    <p>Acesso restrito. Entre com a conta Google autorizada para gerenciar o site.</p>
    <button type="submit" class="gbtn">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3.1-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Entrar com Google
    </button>
    <div class="err" id="loginErr"></div>
    <div class="foot">🔒 Conexão protegida</div>
  </form>
</div>

<!-- PAINEL -->
<div id="panel" class="app hidden">
  <aside class="side">
    <div class="logo"><img src="logoadmin.png" alt="DK Service" onerror="this.style.display='none'"></div>
    <div class="lbl">Seções do site</div>
    <nav class="nav" id="nav"></nav>
    <div class="bottom">
      <div class="user"><img id="uPhoto" alt=""><div><div class="nm" id="uName"></div><div class="em" id="uMail"></div></div></div>
      <button class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>&nbsp; Sair</button>
    </div>
  </aside>

  <div class="content">
    <div class="topbar">
      <div class="ttl"><h2 id="secTitle">Visão geral</h2><div class="sub" id="secSub">Escolha uma seção para editar</div></div>
      <div class="status" id="status"><i class="fa-solid fa-circle-check"></i> Tudo salvo</div>
      <button class="btn btn-ghost" id="prevBtn"><i class="fa-solid fa-eye"></i> Pré-visualizar</button>
      <a class="btn btn-ghost" href="index.html" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> Abrir site</a>
      <button class="btn btn-save" id="saveBtn" disabled><i class="fa-solid fa-floppy-disk"></i> <span id="saveTxt">Salvar alterações</span></button>
    </div>
    <main id="main"></main>
  </div>
</div>

<div class="preview" id="preview">
  <div class="ph"><span><i class="fa-solid fa-eye"></i>&nbsp; Site ao vivo</span><button id="prevClose"><i class="fa-solid fa-xmark"></i></button></div>
  <iframe id="prevFrame" title="Pré-visualização"></iframe>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, deleteDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig, ADMIN_EMAILS } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
const toast = (msg, icon='fa-circle-check') => { const t=$('toast'); t.innerHTML=`<i class="fa-solid ${icon}"></i> ${msg}`; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add('hidden'),3200); };

// ---------- Login ----------
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('loginErr').textContent = '';
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch { $('loginErr').textContent = 'Não foi possível entrar com o Google.'; }
});
$('logoutBtn').addEventListener('click', () => signOut(auth));

let started = false;
onAuthStateChanged(auth, async user => {
  if (user && !ADMIN_EMAILS.includes((user.email || '').toLowerCase())) {
    await signOut(auth);
    $('loginErr').textContent = 'Esta conta Google não tem permissão para acessar o painel.';
    return;
  }
  $('login').classList.toggle('hidden', !!user);
  $('panel').classList.toggle('hidden', !user);
  if (user) {
    $('uName').textContent = user.displayName || 'Administrador';
    $('uMail').textContent = user.email || '';
    if (user.photoURL) $('uPhoto').src = user.photoURL; else $('uPhoto').style.display = 'none';
  }
  if (user && !started) { started = true; init(); }
});

// ---------- Estado ----------
let fields = [];
let savedTexts = {}, savedImgs = {};
let pendingText = {}, pendingImg = {}, pendingReset = new Set();
let currentSec = 'home';

const ICONS = { '0':'fa-share-nodes', '1':'fa-window-maximize', '2':'fa-rocket', '3':'fa-star', '4':'fa-images', '5':'fa-comments', '6':'fa-circle-question', '7':'fa-bullhorn', '8':'fa-table-columns' };
const SUBS  = { '0':'WhatsApp, Facebook, Instagram e TikTok', '1':'Logo e menu de navegação', '2':'Primeira tela que o cliente vê', '3':'Por que escolher a empresa', '4':'Fotos dos trabalhos realizados', '5':'O que os clientes dizem', '6':'Dúvidas mais comuns', '7':'Convite final para contato', '8':'Informações no fim da página' };

async function loadSchema() {
  const html = await (await fetch('index.html?_=' + Date.now())).text();
  const d = new DOMParser().parseFromString(html, 'text/html');
  const seen = new Set();
  d.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    if (seen.has(key) || !el.dataset.label) return;
    seen.add(key);
    const type = el.dataset.type || 'text';
    const def = type === 'img' ? (el.getAttribute('src') || '') : type === 'social' ? '' : el.textContent.replace(/\s+/g, ' ').trim();
    fields.push({ key, type, label: el.dataset.label, group: el.dataset.group || 'Outros', def });
  });
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function parseLabel(label) {
  let m = label.match(/^(Pergunta|Resposta)\s(\d)(.*)$/);
  if (m) return { card: 'Pergunta ' + m[2], name: m[1] + m[3] };
  m = label.match(/^([^()]{1,22}?)(?:\s-\s|:\s)(.+)$/);
  if (m) return { card: m[1], name: cap(m[2]) };
  if (/^(Foto|Avaliação)\s\d$/.test(label)) return { card: label, name: 'Imagem' };
  return { card: 'Geral', name: label };
}
const secId = g => 's' + g.split('.')[0].trim();
const secName = g => g.replace(/^\d+\.\s*/, '');
const secNum = g => g.split('.')[0].trim();

function currentValue(f) {
  if (f.type === 'img') return pendingImg[f.key] ?? savedImgs[f.key] ?? f.def;
  return pendingText[f.key] ?? savedTexts[f.key] ?? f.def;
}
const isPending = k => k in pendingText || k in pendingImg || pendingReset.has(k);

// ---------- Construção da interface ----------
function build() {
  const groups = {};
  fields.forEach(f => (groups[f.group] ||= []).push(f));
  const names = Object.keys(groups).sort();

  // menu
  const nav = $('nav'); nav.innerHTML = '';
  const addNav = (id, icon, text) => {
    const b = document.createElement('button'); b.dataset.sec = id;
    b.innerHTML = `<i class="ic fa-solid ${icon}"></i><span>${text}</span><span class="badge hidden"></span>`;
    b.onclick = () => go(id); nav.appendChild(b);
  };
  addNav('home', 'fa-house', 'Visão geral');
  names.forEach(g => addNav(secId(g), ICONS[secNum(g)] || 'fa-pen', secName(g)));

  // conteúdo
  const main = $('main'); main.innerHTML = '';
  const home = document.createElement('section'); home.className = 'section'; home.id = 'sec-home';
  home.innerHTML = `<div class="hero"><h3>Bem-vindo ao seu painel 👋</h3><p>Aqui você controla tudo no site: textos, fotos, WhatsApp e redes sociais. Escolha uma seção abaixo, faça as mudanças e clique em <b>Salvar alterações</b>. O site se atualiza na hora.</p></div><div class="tiles"></div>`;
  const tiles = home.querySelector('.tiles');
  names.forEach(g => {
    const t = document.createElement('button'); t.className = 'tile';
    t.innerHTML = `<div class="ti"><i class="fa-solid ${ICONS[secNum(g)] || 'fa-pen'}"></i></div><b>${secName(g)}</b><span>${SUBS[secNum(g)] || ''}</span>`;
    t.onclick = () => go(secId(g)); tiles.appendChild(t);
  });
  main.appendChild(home);

  names.forEach(g => {
    const sec = document.createElement('section'); sec.className = 'section'; sec.id = 'sec-' + secId(g);
    // agrupa em cards
    const cards = new Map();
    groups[g].forEach(f => {
      const p = parseLabel(f.label);
      if (!cards.has(p.card)) cards.set(p.card, []);
      cards.get(p.card).push({ f, name: p.name });
    });
    cards.forEach((items, title) => {
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = `<h4>${title}</h4><div class="grid"></div>`;
      const grid = card.querySelector('.grid');
      items.forEach(({ f, name }) => grid.appendChild(buildField(f, name)));
      sec.appendChild(card);
    });
    main.appendChild(sec);
  });

  go(currentSec === 'home' || !document.getElementById('sec-' + currentSec) ? 'home' : currentSec);
  refresh();
}

function go(id) {
  currentSec = id;
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + id));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.sec === id));
  if (id === 'home') { $('secTitle').textContent = 'Visão geral'; $('secSub').textContent = 'Escolha uma seção para editar'; }
  else {
    const g = fields.find(f => secId(f.group) === id).group;
    $('secTitle').textContent = secName(g); $('secSub').textContent = SUBS[secNum(g)] || '';
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildField(f, name) {
  const div = document.createElement('div'); div.dataset.key = f.key;
  const val = currentValue(f);

  if (f.type === 'img') {
    div.className = 'field imgfield full';
    div.innerHTML = `<label><span>${name}</span><span class="dot"></span></label>
      <div class="drop"><img alt=""><div class="ov"><i class="fa-solid fa-cloud-arrow-up"></i><span>Clique ou arraste uma imagem</span></div></div>
      <div class="acts"><button type="button" class="btn btn-ghost btn-sm up"><i class="fa-solid fa-image"></i> Trocar imagem</button><button type="button" class="btn btn-ghost btn-sm rs"><i class="fa-solid fa-rotate-left"></i> Restaurar original</button></div>
      <div class="hint">A imagem é reduzida automaticamente para ficar leve.</div>
      <input type="file" accept="image/*" class="hidden">`;
    const img = div.querySelector('img'), file = div.querySelector('input'), drop = div.querySelector('.drop');
    img.src = val; img.onerror = () => { img.style.opacity = .25; };
    const pick = async fl => {
      if (!fl) return;
      try {
        const data = await compress(fl, f.key.startsWith('logo') ? 700 : 1200);
        pendingImg[f.key] = data; pendingReset.delete(f.key); img.src = data; img.style.opacity = 1; refresh();
      } catch { toast('Não consegui ler essa imagem.', 'fa-triangle-exclamation'); }
    };
    drop.onclick = () => file.click();
    div.querySelector('.up').onclick = () => file.click();
    file.onchange = () => pick(file.files[0]);
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => pick(e.dataTransfer.files[0]));
    div.querySelector('.rs').onclick = () => { delete pendingImg[f.key]; pendingReset.add(f.key); img.src = f.def; img.style.opacity = 1; file.value = ''; refresh(); };
    return div;
  }

  const long = val.length > 70;
  div.className = 'field' + (long ? ' full' : '');
  div.innerHTML = `<label><span>${name}</span><span class="dot"></span></label><div class="row"></div>` + (f.type === 'social' ? '<div class="hint">Cole o link completo. Deixe vazio para esconder o ícone no site.</div>' : '');
  const input = document.createElement(long ? 'textarea' : 'input');
  if (!long) input.type = f.type === 'social' ? 'url' : 'text';
  if (f.type === 'social') input.placeholder = 'https://...';
  input.value = val;
  input.addEventListener('input', () => { pendingText[f.key] = input.value; pendingReset.delete(f.key); refresh(); });
  const rst = document.createElement('button'); rst.type = 'button'; rst.className = 'rst'; rst.title = 'Restaurar original'; rst.innerHTML = '<i class="fa-solid fa-rotate-left"></i>';
  rst.onclick = () => { delete pendingText[f.key]; pendingReset.add(f.key); input.value = f.def; refresh(); };
  div.querySelector('.row').append(input, rst);
  return div;
}

// atualiza marcações de "alterado", contadores e botão salvar
function refresh() {
  document.querySelectorAll('[data-key]').forEach(el => el.classList.toggle('changed', isPending(el.dataset.key)));
  const counts = {};
  let total = 0;
  fields.forEach(f => { if (isPending(f.key)) { total++; const id = secId(f.group); counts[id] = (counts[id] || 0) + 1; } });
  document.querySelectorAll('#nav button').forEach(b => {
    const bd = b.querySelector('.badge'), n = counts[b.dataset.sec] || 0;
    bd.textContent = n; bd.classList.toggle('hidden', !n);
  });
  $('saveBtn').disabled = !total;
  $('saveTxt').textContent = total ? `Salvar alterações (${total})` : 'Salvar alterações';
  const st = $('status');
  st.className = 'status' + (total ? ' dirty' : ' ok');
  st.innerHTML = total ? '<i class="fa-solid fa-circle-exclamation"></i> Alterações não salvas' : '<i class="fa-solid fa-circle-check"></i> Tudo salvo';
}

// ---------- Compressão de imagem (base64) ----------
function compress(file, maxW) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = 0.82, out;
      const mime = (c.toDataURL('image/webp').startsWith('data:image/webp')) ? 'image/webp' : 'image/jpeg';
      do { out = c.toDataURL(mime, q); q -= 0.1; } while (out.length > 800000 && q > 0.2);
      URL.revokeObjectURL(url);
      out.length > 950000 ? reject() : resolve(out);
    };
    img.onerror = reject; img.src = url;
  });
}

// ---------- Salvar ----------
async function save() {
  const b = $('saveBtn'); if (b.disabled) return;
  b.disabled = true; $('saveTxt').textContent = 'Salvando...';
  try {
    const textObj = { ...pendingText };
    const keyType = Object.fromEntries(fields.map(f => [f.key, f.type]));
    pendingReset.forEach(k => { if (keyType[k] !== 'img') textObj[k] = deleteField(); });
    if (Object.keys(textObj).length) await setDoc(doc(db, 'dk', 'content'), textObj, { merge: true });
    for (const [k, data] of Object.entries(pendingImg)) await setDoc(doc(db, 'dk_img', k), { data });
    for (const k of pendingReset) if (keyType[k] === 'img') await deleteDoc(doc(db, 'dk_img', k));
    pendingText = {}; pendingImg = {}; pendingReset = new Set();
    refresh(); toast('Site atualizado com sucesso!');
  } catch (e) {
    console.error(e); toast('Erro ao salvar. Verifique as regras do Firestore e o login.', 'fa-triangle-exclamation');
    refresh();
  }
}
$('saveBtn').addEventListener('click', save);
window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });
window.addEventListener('beforeunload', e => { if (Object.keys(pendingText).length || Object.keys(pendingImg).length || pendingReset.size) { e.preventDefault(); e.returnValue = ''; } });

// ---------- Pré-visualização ----------
$('prevBtn').addEventListener('click', () => {
  const p = $('preview'); const f = $('prevFrame');
  if (!f.src) f.src = 'index.html';
  p.classList.toggle('open');
});
$('prevClose').addEventListener('click', () => $('preview').classList.remove('open'));

// ---------- Início ----------
async function init() {
  try { await loadSchema(); }
  catch { $('main').innerHTML = '<div class="card">Não consegui carregar o index.html. Abra o painel pelo site publicado, não direto do arquivo no computador.</div>'; return; }
  let built = false, gotT = false, gotI = false;
  const maybe = () => { if (!built && gotT && gotI) { built = true; build(); } };
  onSnapshot(doc(db, 'dk', 'content'), s => { savedTexts = s.exists() ? s.data() : {}; gotT = true; maybe(); });
  onSnapshot(collection(db, 'dk_img'), s => { const o = {}; s.forEach(d => o[d.id] = d.data().data); savedImgs = o; gotI = true; maybe(); });
}
</script>
